<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <!-- Nebula, the default gradient -->
    <linearGradient id="g" x1="0.12" y1="0.92" x2="0.9" y2="0.08">
      <stop offset="0" stop-color="#3B1FA8"/>
      <stop offset="0.38" stop-color="#B026C9"/>
      <stop offset="0.7" stop-color="#FF4F8B"/>
      <stop offset="1" stop-color="#FFC2A1"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3B1FA8"/>
      <stop offset="0.38" stop-color="#B026C9"/>
      <stop offset="0.7" stop-color="#FF4F8B"/>
      <stop offset="1" stop-color="#FFC2A1"/>
    </linearGradient>
    <radialGradient id="dome" cx="0.66" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#FFF" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#FFF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#FFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter>
  </defs>
  <!-- a glowing orb… -->
  <circle cx="60" cy="48" r="33" fill="url(#g)" filter="url(#glow)" opacity="0.6"/>
  <circle cx="60" cy="48" r="33" fill="url(#g)"/>
  <circle cx="60" cy="48" r="33" fill="url(#dome)"/>
  <!-- …and the gradient bar with its stops, as in the editor -->
  <rect x="12" y="95" width="96" height="10" rx="5" fill="url(#bar)"/>
  <g stroke="#FFF" stroke-width="2.5">
    <circle cx="17" cy="100" r="6.5" fill="#3B1FA8"/>
    <circle cx="70" cy="100" r="6.5" fill="#FF4F8B"/>
    <circle cx="103" cy="100" r="6.5" fill="#FFC2A1"/>
  </g>
</svg>
